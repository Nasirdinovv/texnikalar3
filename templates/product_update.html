{% extends "base.html" %}

{% block title %}Mahsulotni tahrirlash: {{ product.name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
        <!-- Sarlavha -->
        <div class="px-8 py-6 border-b border-gray-700 bg-gray-800/50">
            <h2 class="text-xl font-bold text-white">Mahsulot ma'lumotlarini yangilash</h2>
        </div>

        <!-- Forma -->
        <form action="" method="POST" enctype="multipart/form-data" class="p-8 space-y-6">
            {% csrf_token %}
            
            <!-- Mahsulot nomi -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-400 mb-2">Mahsulot nomi</label>
                <input type="text" name="name" id="name" value="{{ product.name }}"
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2.5 px-4 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                    placeholder="Masalan: G'isht">
            </div>

            <!-- Rasm -->
            <div>
                <label for="image" class="block text-sm font-medium text-gray-400 mb-2">Mahsulot rasmi</label>
                <div class="flex items-center gap-4">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="" class="w-16 h-16 object-cover rounded border border-gray-700">
                    {% endif %}
                    <input type="file" name="image" id="image"
                        class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-900/30 file:text-blue-400 hover:file:bg-blue-900/50 transition-all cursor-pointer">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- O'lchov birligi -->
                <div>
                    <label for="unit" class="block text-sm font-medium text-gray-400 mb-2">O'lchov birligi</label>
                    <select name="unit" id="unit"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2.5 px-4 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                        <option value="litr" {% if product.unit == 'litr' %}selected{% endif %}>Litr</option>
                        <option value="piece" {% if product.unit == 'piece' %}selected{% endif %}>Dona</option>
                        <option value="box" {% if product.unit == 'box' %}selected{% endif %}>Quti</option>
                    </select>
                </div>

                <!-- Miqdori -->
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-400 mb-2">Miqdori (Qoldiq)</label>
                    <input type="number" name="amount" id="amount" value="{{ product.amount }}"
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2.5 px-4 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono">
                </div>
            </div>

            <!-- Tugmalar -->
            <div class="flex items-center justify-end gap-4 pt-4 border-t border-gray-700">
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-8 rounded-lg transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                    Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
