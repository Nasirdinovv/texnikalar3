{% extends "base.html" %}

{% block title %}Maoshni tahrirlash{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-gray-800 rounded-xl shadow-2xl border border-gray-700 overflow-hidden">
        <div class="px-8 py-6 border-b border-gray-700 bg-gray-800/50">
            <h2 class="text-xl font-bold text-white">Maosh ma'lumotlarini yangilash</h2>
            <p class="mt-1 text-sm text-gray-400">{{ hodim.first_name }} {{ hodim.last_name }}</p>
        </div>

        <form method="POST" class="p-8 space-y-6">
            {% csrf_token %}

            <div>
                <label for="month" class="block text-sm font-medium text-gray-400 mb-2">Oy</label>
                <select name="month" id="month"
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2.5 px-4 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                    <option value="1" {% if salary.month == '1' %}selected{% endif %}>Yanvar</option>
                    <option value="2" {% if salary.month == '2' %}selected{% endif %}>Fevral</option>
                    <option value="3" {% if salary.month == '3' %}selected{% endif %}>Mart</option>
                    <option value="4" {% if salary.month == '4' %}selected{% endif %}>Aprel</option>
                    <option value="5" {% if salary.month == '5' %}selected{% endif %}>May</option>
                    <option value="6" {% if salary.month == '6' %}selected{% endif %}>Iyun</option>
                    <option value="7" {% if salary.month == '7' %}selected{% endif %}>Iyul</option>
                    <option value="8" {% if salary.month == '8' %}selected{% endif %}>Avgust</option>
                    <option value="9" {% if salary.month == '9' %}selected{% endif %}>Sentabr</option>
                    <option value="10" {% if salary.month == '10' %}selected{% endif %}>Oktabr</option>
                    <option value="11" {% if salary.month == '11' %}selected{% endif %}>Noyabr</option>
                    <option value="12" {% if salary.month == '12' %}selected{% endif %}>Dekabr</option>
                </select>
            </div>

            <div>
                <label for="salary_sum" class="block text-sm font-medium text-gray-400 mb-2">Maosh summasi</label>
                <input type="text" name="salary_sum" id="salary_sum" value="{{ salary.salary_sum }}"
                    class="w-full bg-gray-900 border border-gray-700 rounded-lg py-2.5 px-4 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all font-mono"
                    placeholder="Masalan: 5000000">
            </div>

            <div class="flex items-center justify-end gap-4 pt-4 border-t border-gray-700">
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-8 rounded-lg transition-all shadow-lg shadow-blue-900/20 active:scale-95">
                    Saqlash
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
